name: Docker

on:
    workflow_dispatch:
    push:
        branches: ["main"]

concurrency:
    group: docker-publish
    cancel-in-progress: false

# GITHUB_TOKEN (rather than a PAT) is what makes GitHub auto-link the
# pushed package to this repository
permissions:
    contents: read
    packages: write

jobs:
    build-amd64:
        name: Build AMD64
        runs-on: ubuntu-latest
        steps:
            - name: Check out code
              uses: actions/checkout@v6

            # Without this, src/wasm/api-auth doesn't exist when the
            # Dockerfile runs "vite build", so vite.config.mjs stubs in a
            # signer that always throws - every request to a backend with
            # "authSecretEnv" set (e.g. Middle Way) then silently fails
            # before it's ever fetched. Mirrors "deploy main.yml"
            - name: Set up Rust wasm toolchain
              run: |
                  rustup target add wasm32-unknown-unknown
                  cargo install wasm-pack --locked

            - name: Build wasm-auth
              env:
                  VITE_API_AUTH_SECRET_MIDDLEWAY:
                      ${{ secrets.VITE_API_AUTH_SECRET_MIDDLEWAY }}
              run: npm run build:wasm-auth

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              run:
                  docker buildx build --push --platform linux/amd64 --build-arg
                  NETWORK=mainnet -t ghcr.io/swapmarket/web-app:amd64 .

    create-manifest:
        name: Create Manifest
        runs-on: ubuntu-latest
        needs: [build-amd64]
        steps:
            - name: Log in to Docker Hub
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Create and push manifest
              run: |
                  docker buildx imagetools create \
                    --tag ghcr.io/swapmarket/web-app:latest \
                    ghcr.io/swapmarket/web-app:amd64

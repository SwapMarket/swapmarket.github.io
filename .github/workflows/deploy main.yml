# Simple workflow for deploying static content to GitHub Pages
name: Deploy main

on:
    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
    contents: read
    pages: write
    id-token: write
    attestations: write

# Allow one concurrent deployment
concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    # Deploy mainnet
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: "npm"

            - name: Install dependencies
              run: npm install

            - name: Copy config
              run: npm run mainnet

            - name: Set up Rust wasm toolchain
              run: |
                  rustup target add wasm32-unknown-unknown
                  cargo install wasm-pack --locked

            - name: Build wasm-auth
              env:
                  VITE_API_AUTH_SECRET_MIDDLEWAY:
                      ${{ secrets.VITE_API_AUTH_SECRET_MIDDLEWAY }}
              run: npm run build:wasm-auth

            - name: Build
              env:
                  VITE_RSK_LOG_SCAN_ENDPOINT: ""
              run: npm run build

            # Kept so "Deploy docs" can republish the app without rebuilding it
            - name: Upload app build
              uses: actions/upload-artifact@v4
              with:
                  name: app-dist
                  path: "./dist"
                  include-hidden-files: true
                  retention-days: 90

            - name: Build docs
              run: npx vitepress build docs --outDir dist/docs

            - name: Setup Pages
              uses: actions/configure-pages@v4

            - name: Attest build provenance
              uses: actions/attest-build-provenance@v1
              with:
                  subject-path: "${{ github.workspace }}/dist"

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  # Upload dist folder
                  path: "./dist"
                  # Kept so "Deploy gittr" can mirror it without rebuilding
                  retention-days: 90

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4

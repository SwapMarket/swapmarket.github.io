# Simple workflow for deploying static content to GitHub Pages
name: Deploy main

on:
    # Allows you to run this workflow manually from the Actions tab
    workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
    contents: read
    pages: write
    id-token: write
    attestations: write

# Allow one concurrent deployment
concurrency:
    group: "pages"
    cancel-in-progress: false

jobs:
    # Deploy mainnet
    deploy:
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: "npm"

            - name: Install dependencies
              run: npm install

            - name: Copy config
              run: npm run mainnet

            - name: Set up Rust wasm toolchain
              run: |
                  rustup target add wasm32-unknown-unknown
                  cargo install wasm-pack --locked

            - name: Build wasm-auth
              env:
                  VITE_API_AUTH_SECRET_MIDDLEWAY:
                      ${{ secrets.VITE_API_AUTH_SECRET_MIDDLEWAY }}
              run: npm run build:wasm-auth

            - name: Build
              env:
                  VITE_RSK_LOG_SCAN_ENDPOINT: ""
              run: npm run build

            # Kept so "Deploy docs" can republish the app without rebuilding it
            - name: Upload app build
              uses: actions/upload-artifact@v4
              with:
                  name: app-dist
                  path: "./dist"
                  include-hidden-files: true
                  retention-days: 90

            - name: Build docs
              run: npx vitepress build docs --outDir dist/docs

            - name: Setup Pages
              uses: actions/configure-pages@v4

            - name: Attest build provenance
              uses: actions/attest-build-provenance@v1
              with:
                  subject-path: "${{ github.workspace }}/dist"

            - name: Upload artifact
              uses: actions/upload-pages-artifact@v3
              with:
                  # Upload dist folder
                  path: "./dist"

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4

    # Mirror the deployed site (app and docs) to the "site" repo on gittr.
    # Publishing it as gittr Pages is manual: click "Push Manifest" on gittr
    gittr:
        needs: deploy
        runs-on: ubuntu-latest
        env:
            GITTR_REMOTE: git@git.gittr.space:npub1xhklzztd83v34zsf9da2gvfrctj5wcsvsx09er9v26jy7r0uq8yq4vme7d/site.git
        steps:
            - name: Download deployed site
              uses: actions/download-artifact@v4
              with:
                  name: github-pages
                  path: ./artifact

            - name: Extract site
              run: mkdir site && tar -xf artifact/artifact.tar -C site

            - name: Push to gittr
              env:
                  GITTR_SSH_KEY: ${{ secrets.GITTR_SSH_KEY }}
              run: |
                  if [ -z "$GITTR_SSH_KEY" ]; then
                    echo "::warning::GITTR_SSH_KEY is not set, skipping gittr deploy"
                    exit 0
                  fi
                  mkdir -p ~/.ssh
                  echo "$GITTR_SSH_KEY" > ~/.ssh/gittr
                  chmod 600 ~/.ssh/gittr
                  echo "git.gittr.space ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGmBZGtqjQ1GeLCNk8tGv1IOpr1p5WXEwpOrffY+jacm" >> ~/.ssh/known_hosts
                  cd site
                  git init -q -b main
                  git add -A
                  git -c user.name="SwapMarket" -c user.email="swapmarket@users.noreply.github.com" \
                    commit -q -m "Deploy ${GITHUB_SHA}"
                  # A single fresh commit each time, so old builds don't pile up
                  GIT_SSH_COMMAND="ssh -i ~/.ssh/gittr -o IdentitiesOnly=yes" \
                    git push --force "$GITTR_REMOTE" main
